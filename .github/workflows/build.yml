# Сборка под три платформы. Запускается вручную или по тегу v*.
#
# macOS собирается universal-бинарником (Apple Silicon + Intel) без нотаризации.
# Linux и Windows — обычные бандлы; нативное размытие окна и Keychain на них
# отсутствуют, секреты хранятся в файле библиотеки.
name: build

on:
    workflow_dispatch:
    push:
        tags: ['v*']

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      args: '--target universal-apple-darwin'
                      targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
                    - os: ubuntu-22.04
                      args: ''
                      targets: ''
                    - os: windows-latest
                      args: ''
                      targets: ''

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.targets }}

            - uses: swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri

            - name: Системные зависимости (Linux)
              if: matrix.os == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
                      librsvg2-dev patchelf libgtk-3-dev

            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm --filter @resolvr/mcp build

            - uses: tauri-apps/tauri-action@v0
              env:
                  # Ключ подписи обновлений (minisign): `tauri signer generate`.
                  # Секреты репозитория: Settings → Secrets and variables → Actions.
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  projectPath: apps/desktop
                  args: ${{ matrix.args }}
                  # Без Developer ID подпись ad-hoc; см. docs/INSTALL.md.
                  tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
                  releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Resolvr {0}', github.ref_name) || '' }}
                  releaseDraft: true
                  # latest.json нужен встроенному updater; без него приложение не
                  # узнает о новой версии.
                  includeUpdaterJson: true

            - uses: actions/upload-artifact@v4
              with:
                  name: resolvr-${{ matrix.os }}
                  path: |
                      apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
                      apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
                      apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
                      apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
                      apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
                      apps/desktop/src-tauri/target/**/release/bundle/**/*.sig
                      apps/desktop/src-tauri/target/**/release/bundle/**/*.tar.gz
                  if-no-files-found: ignore
