# Сборка под три платформы. Запускается вручную или по тегу v*.
#
# macOS собирается universal-бинарником (Apple Silicon + Intel) без нотаризации.
# Linux и Windows — обычные бандлы; нативное размытие окна и Keychain на них
# отсутствуют, секреты хранятся в файле библиотеки.
name: build

on:
    workflow_dispatch:
    push:
        tags: ['v*']

# Создание релиза и загрузка артефактов требуют права на запись в contents.
permissions:
    contents: write

jobs:
    # Черновик релиза создаётся один раз, до сборок. Раньше его создавал
    # tauri-action в каждой из трёх параллельных сборок: на новом теге каждая
    # не находила релиз и заводила свой, файлы расползались по трём черновикам,
    # и манифест обновлений не находил их.
    release:
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        outputs:
            id: ${{ steps.release.outputs.id }}

        steps:
            - id: release
              uses: actions/github-script@v7
              with:
                  script: |
                      const tag = context.ref.replace('refs/tags/', '')
                      // Черновики не находятся через /releases/tags/, поэтому поиск по списку.
                      const releases = await github.paginate(github.rest.repos.listReleases, {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          per_page: 100,
                      })
                      const existing = releases.find((item) => item.tag_name === tag)
                      const release =
                          existing ??
                          (
                              await github.rest.repos.createRelease({
                                  owner: context.repo.owner,
                                  repo: context.repo.repo,
                                  tag_name: tag,
                                  name: `Resolvr ${tag}`,
                                  draft: true,
                              })
                          ).data
                      core.setOutput('id', String(release.id))

    build:
        needs: release
        # Без тега задача release пропускается — сборка всё равно нужна.
        if: ${{ !failure() && !cancelled() }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      args: '--target universal-apple-darwin'
                      targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
                    - os: ubuntu-22.04
                      args: ''
                      targets: ''
                    - os: windows-latest
                      args: ''
                      targets: ''

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            # Версия pnpm берётся из `packageManager` в package.json: указание
            # её здесь ещё раз action считает конфликтом и падает.
            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.targets }}

            - uses: swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri

            - name: Системные зависимости (Linux)
              if: matrix.os == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
                      librsvg2-dev patchelf libgtk-3-dev

            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm --filter @resolvr/mcp build

            - uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Ключ подписи обновлений (minisign): `tauri signer generate`.
                  # Секреты репозитория: Settings → Secrets and variables → Actions.
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  projectPath: apps/desktop
                  # По умолчанию action зовёт `npm run tauri`; у нас pnpm-workspace.
                  tauriScript: pnpm tauri
                  args: ${{ matrix.args }}
                  # Без Developer ID подпись ad-hoc; см. docs/INSTALL.md.
                  # Файлы загружаются в черновик, созданный задачей release;
                  # без тега releaseId пуст и ничего не публикуется.
                  releaseId: ${{ needs.release.outputs.id }}
                  # Манифест собирает отдельная задача после всех сборок:
                  # параллельная дозапись одного файла тремя платформами давала
                  # смесь подписей разных прогонов.
                  includeUpdaterJson: false

            - uses: actions/upload-artifact@v4
              with:
                  name: resolvr-${{ matrix.os }}
                  path: |
                      apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
                      apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
                      apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
                      apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
                      apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
                      apps/desktop/src-tauri/target/**/release/bundle/**/*.sig
                      apps/desktop/src-tauri/target/**/release/bundle/**/*.tar.gz
                  if-no-files-found: ignore

    # Манифест обновления — один раз, из подписей рядом с загруженными файлами.
    updater-manifest:
        needs: build
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - run: node scripts/build-updater-manifest.mjs ${{ github.ref_name }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
