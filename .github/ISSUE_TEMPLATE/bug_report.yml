name: Bug report
description: Something does not work
labels: [bug]
body:
    - type: textarea
      id: diagnostics
      attributes:
          label: Diagnostics
          description: Settings → About → Copy diagnostics (version, OS, architecture).
          render: text
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          placeholder: |
              1.
              2.
      validations:
          required: true
    - type: textarea
      id: result
      attributes:
          label: Expected / actual
      validations:
          required: true
    - type: textarea
      id: log
      attributes:
          label: Log
          description: >-
              Resolvr → Open Logs (or Settings → About → Logs): attach `resolvr.log` or paste
              the lines around the problem. The log contains no tokens, secrets or request
              bodies. On Linux, mention the GPU driver (for example NVIDIA 550, X11).
          render: text
    - type: textarea
      id: request
      attributes:
          label: Request (optional)
          description: Copy as curl without secrets.
          render: shell
