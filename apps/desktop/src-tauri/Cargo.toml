[package]
name = "resolvr"
version = "0.2.6"
description = "Desktop GraphQL client and IDE for macOS, Linux and Windows with an MCP server for AI agents"
authors = ["hojttaler"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "resolvr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools", "image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# HTTP-прокси: webview не может ходить на произвольные хосты из-за CORS,
# поэтому все запросы уходят через Rust.
reqwest = { version = "0.13", features = ["json", "stream", "gzip", "brotli"] }
futures-util = "0.3"

# Секреты в системном Keychain. Фича `v1` включена по умолчанию и подключает
# нативное хранилище Apple Keychain.
keyring = "4"

# Отслеживание изменений файлов: правки, сделанные агентом через MCP,
# подхватываются в открытом приложении без перезапуска.
notify = "8"
notify-debouncer-full = "0.6"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
